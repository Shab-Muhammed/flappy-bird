<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4ec0ca">
  <meta name="description" content="Classic Flappy Bird arcade game featuring hand-crafted retro textures, parallax moving scenery, and dynamic day/night cycles.">
  <title>Flappy Bird - Classic Arcade</title>

  <!-- Google Fonts: Fredoka & Press Start 2P for Arcade Polish -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Top Audio and Time Control Bar -->
    <header id="ui-header">
      <button id="sound-btn" class="icon-btn" aria-label="Toggle Sound" title="Toggle Sound (M)">
        <svg id="sound-icon-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>

      <!-- Interactive Day/Night Cycle Button -->
      <button id="cycle-badge" class="header-pill cycle-pill" aria-label="Toggle Time of Day" title="Click or Press 'T' to Change Day/Night">
        <span id="cycle-icon">☀️</span>
        <span id="cycle-text" class="pill-time">DAY</span>
      </button>

      <!-- Interactive Season Button -->
      <button id="season-badge" class="header-pill season-pill" aria-label="Toggle Season" title="Click or Press 'S' to Change Season">
        <span id="season-icon">🌸</span>
        <span id="season-text" class="pill-season">SPRING</span>
      </button>

      <div class="header-pill best-pill">
        <span class="pill-label">BEST</span>
        <span id="best-score-badge" class="pill-value">0</span>
      </div>
    </header>

    <!-- Main Responsive High-DPI HTML5 Canvas -->
    <canvas id="game-canvas" width="360" height="640"></canvas>

    <!-- Fallback Screen Reader Announcements -->
    <div id="sr-announcements" class="sr-only" aria-live="polite"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
